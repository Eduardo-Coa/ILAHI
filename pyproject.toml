[project]
# OJO: `name` NO se renombra a "ilahi" aunque la app ya se llame así. De aquí sale
# el id de paquete de Android (com.eduardocoa.hymnchords): cambiarlo hace que el
# teléfono la trate como una app DISTINTA — se instalaría al lado de la actual y la
# biblioteca guardada en la carpeta privada de la vieja quedaría inaccesible. El
# nombre visible bajo el ícono lo da `product`, más abajo, y ya dice Ilahi.
name = "hymnchords"
version = "1.0.0"
description = "Ilahi — cifrado y acordes para guitarristas de iglesia"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet==0.85.3",
    "flet-audio==0.85.3",   # clicks del metrónomo (Audio ya no viene en el core)
]

[tool.flet]
org = "com.eduardocoa"
# `product` es el nombre que se ve bajo el ícono en el teléfono. El id del paquete
# sale de `[project] name`, así que renombrar aquí no reinstala la app desde cero.
product = "Ilahi"
company = "Ilahi"
copyright = "Copyright (C) 2026 Eduardo Coa"

# Pantalla de arranque (splash): fondo NEGRO con el logo del modo oscuro (cream sobre
# negro). La imagen sale de assets/splash.png y splash_dark.png (copias de
# Ilahi-claro.png, RGBA transparente). Sin esta config, Flet usaría el ícono sobre un
# fondo claro por defecto. icon_bgcolor negrea también el splash breve de Android 12+.
# Qué NO se empaqueta dentro del APK. Flet solo excluye `build/` por defecto, así que
# sin esta lista el .apk se lleva el entorno virtual, el repositorio git y la carpeta
# `storage/` con la base de desarrollo y TODOS los respaldos: unos 116 MB de los 120
# del payload, y además la biblioteca de canciones viajaría dentro del archivo que uno
# comparte. Ojo: `assets/` NO va aquí (el ícono, el logo y los clicks del metrónomo se
# leen en tiempo de ejecución), y tampoco `sample_data.py` ni `theme.py`, que main.py
# importa. `flet_template/` se lee del proyecto al compilar, no del paquete.
[tool.flet.app]
exclude = [
    ".venv",
    ".git",
    ".github",
    "storage",          # base de desarrollo + respaldos (lo más pesado)
    "tests",
    "ui_lab",           # maquetas de interfaz, solo desarrollo
    "tools",            # scripts de desarrollo (reseed, íconos)
    "flet_template",    # plantilla de build, no hace falta en tiempo de ejecución
    ".pytest_cache",
    "__pycache__",
    ".claude",
    ".gitignore",
    "pytest.ini",
    "requirements-dev.txt",
    "ROADMAP.md",
    "README.md",
]

[tool.flet.splash]
color = "#000000"
dark_color = "#000000"
icon_bgcolor = "#000000"
icon_dark_bgcolor = "#000000"

# Plantilla de build PROPIA (copia de la de Flet 0.85.3 en flet_template/), con un
# único cambio: el «boot screen» (BlankScreen, la pantalla que se ve mientras arranca
# el motor de Python) va en NEGRO en vez del gris por defecto de Material, para que el
# arranque no tenga un destello gris. OJO: si se sube la versión de Flet, hay que
# re-sincronizar esta copia con la plantilla nueva (ver flet_template/README).
[tool.flet.template]
url = "flet_template/build"
